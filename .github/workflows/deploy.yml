name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/mayo-game-architecture-yotuzg
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Bewusst KEIN "environment: github-pages" gesetzt: GitHub legt dafuer
    # automatisch eine Deployment-Branch-Regel an, die standardmaessig nur
    # den Default-Branch (main) zulaesst. Ohne diese Bindung greift keine
    # Branch-Beschraenkung und der Workflow kann von jedem Branch aus
    # (z. B. dem aktuellen Feature-Branch) deployen.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Nur die tatsaechlichen Spiel-Dateien deployen, insbesondere NICHT
      # das .git-Verzeichnis (waere sonst oeffentlich ueber die Pages-URL
      # abrufbar).
      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp -r index.html css js data _site/
          if [ -d assets ]; then cp -r assets _site/; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
